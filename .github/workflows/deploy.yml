name: Publish billing pages

# Serves the customer approval page at billing.citeamotors.com.
# The page is copied from the live team portal site (teams.citeamotors.com), which deploys from citeamotors/portal.
# Runs on every push, by hand from the Actions tab, and every hour so it stays in step with the portal.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download pages
        run: |
          mkdir -p site
          base="https://teams.citeamotors.com"
          curl -fsSL "$base/approve.html?nocache=$GITHUB_RUN_ID" -o site/approve.html
          grep -q "Citea" site/approve.html
          for f in favicon.ico favicon.svg apple-touch-icon.png; do curl -fsSL "$base/$f?nocache=$GITHUB_RUN_ID" -o "site/$f"; done
          cp site/approve.html site/index.html
          echo "billing.citeamotors.com" > site/CNAME
          sha256sum site/*
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
